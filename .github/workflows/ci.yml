name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]' 'build==1.3.0' 'twine==6.2.0'

      - name: Ruff
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q -ra --junitxml=results.xml

      - name: Refuse skipped or empty suites
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          total = sum(int(suite.get("tests", "0")) for suite in suites)
          skipped = sum(int(suite.get("skipped", "0")) for suite in suites)
          print(f"{total} tests, {skipped} skipped")
          if not total or skipped:
              sys.exit("The complete test suite must run without skips")
          PY

      - name: Build and check distributions
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          set -euo pipefail
          python -m build
          python -m twine check dist/*
