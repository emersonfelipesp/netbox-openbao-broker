name: Release validation and public publishing

on:
  push:
    tags: ["v*rc*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing final release tag to publish after validation
        required: true
        type: string
      target:
        description: Public package index to receive the validated release
        required: true
        default: pypi
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read

jobs:
  validate-build:
    if: ${{ github.repository == 'emersonfelipesp/netbox-openbao-broker' }}
    runs-on: ubuntu-latest
    outputs:
      repository_url: ${{ steps.release.outputs.repository_url }}
      target: ${{ steps.release.outputs.target }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout canonical-main policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Validate event, tag, package version, and canonical main
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_TARGET: ${{ inputs.target }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          test "$EVENT_NAME" != release || tag="$RELEASE_TAG"
          test "$EVENT_NAME" != workflow_dispatch || tag="$DISPATCH_TAG"
          if test "$EVENT_NAME" = workflow_dispatch; then
            printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.post[1-9][0-9]*)?$'
          fi
          IFS=$'\t' read -r event target repository_url < <(
            python scripts/select_public_release_target.py \
              --event-name "$EVENT_NAME" --dispatch-target "$DISPATCH_TARGET"
          )
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "repository_url=$repository_url" >> "$GITHUB_OUTPUT"
          git fetch --force --no-tags origin "+refs/tags/${tag}:refs/release-policy/candidate"
          git fetch --force --no-tags origin "+refs/heads/main:refs/release-policy/main"
          test "$(git rev-parse HEAD^{commit})" = "$(git rev-parse refs/release-policy/main^{commit})"
          python scripts/validate_release_ref.py --repository . --tag "$tag" \
            --event "$event" --github-output "$GITHUB_OUTPUT"

      - name: Checkout validated release source
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          test "$SOURCE_SHA" = "$(git rev-parse refs/release-policy/candidate^{commit})"
          git checkout --detach --force "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD^{commit})"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build, check, and bind distributions
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'build==1.3.0' 'twine==6.2.0'
          python -m build
          python -m twine check dist/*
          python scripts/validate_distributions.py --dist dist --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --output dist/release-manifest.json

      - name: Transfer one validated artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: validate-build
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validate-build.outputs.target }}
    permissions:
      contents: read
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-release-dist
          path: dist

      - name: Publish to TestPyPI with scoped API credentials
        if: ${{ needs.validate-build.outputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: ${{ needs.validate-build.outputs.repository_url }}
          user: ${{ secrets.TEST_PYPI_USERNAME }}
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          attestations: false

      - name: Publish to PyPI with the scoped API token
        if: ${{ needs.validate-build.outputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: ${{ needs.validate-build.outputs.repository_url }}
          password: ${{ secrets.PYPI_TOKEN }}
          attestations: false
