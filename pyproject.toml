[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-openbao-broker"
version = "0.1.0"
requires-python = ">=3.11"
description = "Holds the OpenBao AppRole so NetBox never possesses credentials able to read production secrets"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
authors = [{name = "Emerson Felipe", email = "emerson.felipe@nmultifibra.com.br"}]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "hvac>=2.3.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "cryptography>=42"]

[project.scripts]
netbox-openbao-broker = "broker.__main__:main"

[project.urls]
Source = "https://git.nmulti.cloud/emersonfelipesp/netbox-openbao-broker"
Issues = "https://git.nmulti.cloud/emersonfelipesp/netbox-openbao-broker/issues"

[tool.setuptools.packages.find]
include = ["broker*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603"]
# B008 fires on `Depends(...)` in a parameter default, which is FastAPI's
# documented way of declaring a dependency. The rule is right in general and
# wrong here.
"broker/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
